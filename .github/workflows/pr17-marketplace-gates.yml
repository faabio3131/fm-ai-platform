name: PR17 Marketplace Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  marketplace:
    name: Framework, contrato e sandbox marketplace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR17
        run: >-
          ruff check core/marketplaces tests/unit/marketplaces
          tests/integration/marketplaces tests/contract/marketplaces
          tests/e2e-marketplace
      - name: mypy PR17
        run: mypy core/marketplaces
      - name: Testes focados PR17
        run: >-
          pytest -q tests/unit/marketplaces tests/integration/marketplaces
          tests/contract/marketplaces tests/e2e-marketplace
      - name: Suite Python completa
        run: pytest -q
