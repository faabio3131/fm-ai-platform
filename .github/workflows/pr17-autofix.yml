name: PR17 Autofix Temporario

on:
  push:
    branches: [codex/implementar-marketplace-framework-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-marketplace-framework-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir teste intencional de datetime naive
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/unit/marketplaces/test_modelos.py')
          s = p.read_text()
          s = s.replace(
              'atualizado_em=datetime.now(),',
              'atualizado_em=datetime.now(timezone.utc).replace(tzinfo=None),',
          )
          p.write_text(s)
          PY
      - name: Ruff autofix
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/marketplaces tests/unit/marketplaces tests/integration/marketplaces tests/contract/marketplaces tests/e2e-marketplace --fix
          ruff check core/marketplaces tests/unit/marketplaces tests/integration/marketplaces tests/contract/marketplaces tests/e2e-marketplace
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/marketplaces tests/unit/marketplaces tests/integration/marketplaces tests/contract/marketplaces tests/e2e-marketplace
          git diff --cached --quiet || git commit -m 'chore(marketplace): aplicar ruff autofix PR17'
          git push origin HEAD:codex/implementar-marketplace-framework-v1
