name: Kordena KF02 Gerente IA Release E2E

on:
  pull_request:
    branches:
      - "staging/kordena-premium"
    paths:
      - "application/**"
      - "core/**"
      - "infra/**"
      - "http_api/**"
      - "migrations/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "docs/finalization/**"
      - ".github/workflows/kordena-kf02-gerente-ia-release-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kf02-gerente-ia-release-e2e:
    name: KF-02 Gerente IA current-head release E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kordena_kf02
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kordena_kf02"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2 pip-audit

      - name: Compile KF-02 surfaces
        run: |
          python -m compileall -q             application/gerente_ia_runtime.py             application/gerente_ia_transacoes.py             application/gerente_ia_web.py             core/gerente_ia             http_api/gerente_ia_web.py             infra/gerente_ia             infra/integracoes             gemini_config.py

      - name: Ruff KF-02 surfaces
        run: >-
          ruff check
          application/gerente_ia_runtime.py
          application/gerente_ia_transacoes.py
          application/gerente_ia_web.py
          core/gerente_ia
          http_api/gerente_ia_web.py
          infra/gerente_ia
          gemini_config.py
          tests/unit/gerente_ia
          tests/integration/gerente_ia
          tests/contract/gerente_ia
          tests/api/test_gerente_ia_web_http_contract.py
          tests/unit/integracoes/test_gemini_control_plane_runtime_v1.py
          tests/unit/integracoes/test_gemini_real_healthcheck_v1.py
          tests/integration/integracoes/test_google_maps_control_plane_runtime_v1.py
          tests/unit/integracoes/test_google_maps_real_healthcheck_v1.py
          tests/integration/integracoes/test_platform_managed_command_fallback_v1.py

      - name: Mypy KF-02 runtime
        run: >-
          mypy
          application/gerente_ia_runtime.py
          application/gerente_ia_transacoes.py
          application/gerente_ia_web.py
          core/gerente_ia
          http_api/gerente_ia_web.py
          infra/gerente_ia
          gemini_config.py

      - name: Focused Gerente IA and platform integration tests
        run: |
          pytest -q             tests/unit/gerente_ia             tests/integration/gerente_ia             tests/contract/gerente_ia             tests/api/test_gerente_ia_web_http_contract.py             tests/unit/integracoes/test_gemini_control_plane_runtime_v1.py             tests/unit/integracoes/test_gemini_real_healthcheck_v1.py             tests/integration/integracoes/test_google_maps_control_plane_runtime_v1.py             tests/unit/integracoes/test_google_maps_real_healthcheck_v1.py             tests/integration/integracoes/test_platform_managed_command_fallback_v1.py

      - name: Security and tenancy adversarial subset
        run: |
          pytest -q             tests/fitness/test_kca14_security_hardening.py             tests/security/test_kca14_auth_session_adversarial.py             tests/api/test_auth_http_contract.py             tests/api/test_auth_membership_http_contract.py             tests/api/test_auth_admin_stepup_http_contract.py

      - name: Generate ephemeral KF-02 credentials
        id: ephemeral
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path
          values = {
              "password": secrets.token_urlsafe(32),
              "session": secrets.token_urlsafe(48),
              "fmcc": secrets.token_urlsafe(48),
          }
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as out:
              for key, value in values.items():
                  print(f"::add-mask::{value}")
                  out.write(f"{key}={value}\n")
          PY

      - name: Execute persisted current-head Gerente IA homologation
        env:
          FM_AI_ENV: staging
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kordena_kf02
          FM_AI_TENANT_ID: kf02-bootstrap
          FM_AI_UNIDADE_ID: kf02-bootstrap
          FM_AI_COMMERCIAL_ACCESS_GATE_ENABLED: "1"
          FM_AI_SESSION_SECRET: ${{ steps.ephemeral.outputs.session }}
          FM_AI_FMCC_CONTROL_PLANE_TOKEN: ${{ steps.ephemeral.outputs.fmcc }}
          KCA15_INTERNAL_PASSWORD: ${{ steps.ephemeral.outputs.password }}
          PYTHONPATH: .
        run: |
          test -z "${FM_AI_TEST_MODE:-}"
          python scripts/kca15_internal_homologation.py             --output evidence/kf02-gerente-ia-release-e2e.json

      - name: Verify KF-02 runtime evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("evidence/kf02-gerente-ia-release-e2e.json").read_text())
          assert data["environment"] == "ephemeral_postgresql_staging"
          assert data["fm_ai_test_mode"] is False
          assert data["checks"]["login"] == "pass"
          assert data["checks"]["tenant_unit"] == "pass"
          assert data["checks"]["gerente_ia"] == "pass"
          assert data["checks"]["admin_step_up"] == "pass"
          assert data["checks"]["fmcc_snapshot"] == "pass"
          assert data["billing_real_used"] is False
          assert data["real_customer_used"] is False
          print("KF-02 persisted runtime evidence: PASS")
          PY

      - name: Migration manifest and schema baseline
        run: |
          python - <<'PY'
          from migrations.manifest import assert_migration_manifest
          from migrations.runner import DEFAULT_MIGRATIONS
          assert_migration_manifest(DEFAULT_MIGRATIONS)
          print("Migration manifest: PASS")
          PY
          python scripts/generate_schema_baseline_v1.py --check

      - name: Tracked secret scan
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path
          patterns = {
              "google_api_key": re.compile(r"AIza[0-9A-Za-z_-]{35}"),
              "openai_style_key": re.compile(r"\bsk-[A-Za-z0-9_-]{32,}\b"),
              "github_pat": re.compile(r"\bgh[pousr]_[A-Za-z0-9]{36,}\b"),
              "private_key": re.compile(r"-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----"),
          }
          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          findings = []
          for name in files:
              try:
                  content = Path(name).read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for kind, pattern in patterns.items():
                  if pattern.search(content):
                      findings.append(f"{kind}:{name}")
          if findings:
              raise SystemExit("High-confidence secret patterns found:\n" + "\n".join(findings))
          print(f"Tracked secret scan: PASS ({len(files)} files)")
          PY

      - name: Python dependency audit
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Full Python regression
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Web ESLint
        working-directory: web
        run: npm run lint

      - name: Web TypeScript
        working-directory: web
        run: npx tsc --noEmit

      - name: Web node regression
        working-directory: web
        run: node --test tests/*.test.mjs

      - name: Next production build
        working-directory: web
        run: npm run build

      - name: Diff whitespace
        run: git diff --check origin/staging/kordena-premium...HEAD

      - name: Upload KF-02 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kf02-gerente-ia-release-e2e
          path: evidence/kf02-gerente-ia-release-e2e.json
          if-no-files-found: warn
          retention-days: 14
