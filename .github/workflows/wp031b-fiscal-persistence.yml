name: WP-031B Fiscal Persistence Foundation

on:
  pull_request:
    paths:
      - 'infra/fiscal/**'
      - 'migrations/fiscal_persistence_foundation_v1.py'
      - 'migrations/runner.py'
      - 'migrations/manifest_v1.json'
      - 'tests/integration/fiscal/**'
      - '.github/workflows/wp031b-fiscal-persistence.yml'
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'infra/fiscal/**'
      - 'migrations/fiscal_persistence_foundation_v1.py'
      - 'migrations/runner.py'
      - 'migrations/manifest_v1.json'
      - 'tests/integration/fiscal/**'
      - '.github/workflows/wp031b-fiscal-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal-persistence:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Verify frozen Fiscal V1 baseline
        run: python scripts/validate_wp031_vendor_baseline.py
      - name: Compile
        run: |
          python -m py_compile infra/fiscal/modelos_orm.py infra/fiscal/repositorios_sqlalchemy.py migrations/fiscal_persistence_foundation_v1.py migrations/runner.py
      - name: Ruff
        run: |
          ruff check infra/fiscal migrations/fiscal_persistence_foundation_v1.py migrations/runner.py tests/integration/fiscal
      - name: Mypy
        run: |
          mypy infra/fiscal migrations/fiscal_persistence_foundation_v1.py
      - name: Migration manifest
        run: |
          python - <<'PY'
          from migrations.manifest import assert_migration_manifest
          from migrations.runner import DEFAULT_MIGRATIONS
          assert_migration_manifest(DEFAULT_MIGRATIONS)
          print("Migration manifest: PASS")
          PY
      - name: WP-031B tests
        run: pytest -q tests/integration/fiscal/test_wp031b_persistence.py
      - name: Diff whitespace gate
        run: git diff --check HEAD~1..HEAD
