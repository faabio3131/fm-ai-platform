name: PR16 Autofix Temporario

on:
  push:
    branches: [codex/implementar-delivery-proprio-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-delivery-proprio-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar correcoes nao automaticas
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/delivery/runtime_teste.py')
          s = p.read_text()
          s = s.replace('from threading import RLock\n', 'from threading import RLock\nfrom typing import ClassVar\n')
          s = s.replace('    _TRANSICOES = {', '    _TRANSICOES: ClassVar[dict[StatusEntrega, set[StatusEntrega]]] = {')
          p.write_text(s)
          p = Path('tests/unit/delivery/test_modelos.py')
          s = p.read_text().replace('ocorrido_em=datetime.now(),', 'ocorrido_em=datetime.now(timezone.utc).replace(tzinfo=None),')
          p.write_text(s)
          PY
      - name: Ruff autofix
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/delivery tests/unit/delivery tests/integration/delivery --fix
          ruff check core/delivery tests/unit/delivery tests/integration/delivery
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/delivery tests/unit/delivery tests/integration/delivery
          git diff --cached --quiet || git commit -m 'chore(delivery): aplicar ruff autofix'
          git push origin HEAD:codex/implementar-delivery-proprio-v1
