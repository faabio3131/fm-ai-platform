name: V1 Wave1 PDV Failure Diagnostic

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - '.github/workflows/v1-wave1-pdv-failure-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v1-wave1-authoritative-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Capturar failures PDV
        run: |
          set +e
          pytest -q tests/integration/pdv --tb=short > pdv-wave1-failures.txt 2>&1
          code=$?
          echo "exit_code=$code" >> pdv-wave1-failures.txt
          tail -n 220 pdv-wave1-failures.txt > pdv-wave1-failures.tail
          mv pdv-wave1-failures.tail pdv-wave1-failures.txt
          exit 0
      - name: Publicar relatório temporário
        run: |
          git config user.name "fm-ai-wave1-bot"
          git config user.email "fm-ai-wave1-bot@users.noreply.github.com"
          git add pdv-wave1-failures.txt
          git commit -m "V1 Wave1 PDV-001: capture focused failure report"
          git fetch origin impl/v1-wave1-authoritative-transactions
          git rebase origin/impl/v1-wave1-authoritative-transactions
          git push origin HEAD:impl/v1-wave1-authoritative-transactions
