name: V1 Wave1 PDV Canonical Canary Activation

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - '.github/workflows/v1-wave1-pdv-cutover-activate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v1-wave1-authoritative-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ativar executor canônico do canary
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('core/pdv/executores.py')
          text = path.read_text(encoding='utf-8')
          marker = 'ExecutorAutoritativoSQLAlchemy = ExecutorAutoritativoCanonicoSQLAlchemy'
          if marker in text:
              raise SystemExit('alias canônico já existe')
          text += '''\n\n# O canary da Onda 1 usa o núcleo transacional canônico; shadow/legacy acima\n# permanecem disponíveis para comparação e rollback controlado.\nfrom .executor_canonico import ExecutorAutoritativoCanonicoSQLAlchemy\n\nExecutorAutoritativoSQLAlchemy = ExecutorAutoritativoCanonicoSQLAlchemy\n'''
          path.write_text(text, encoding='utf-8')
          PY
      - name: Validar sintaxe e estilo do cutover
        run: |
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.16.1
          python -m compileall -q application core/pdv infra/transacoes
          ruff check core/pdv/cutover_canonico.py core/pdv/executor_canonico.py core/pdv/modelos.py infra/transacoes/uow.py application/checkout.py
      - name: Commitar ativação
        run: |
          git diff --check
          git config user.name "fm-ai-wave1-bot"
          git config user.email "fm-ai-wave1-bot@users.noreply.github.com"
          git add core/pdv/executores.py
          git commit -m "V1 Wave1 PDV-001: route authoritative canary through canonical executor"
          git fetch origin impl/v1-wave1-authoritative-transactions
          git rebase origin/impl/v1-wave1-authoritative-transactions
          git push origin HEAD:impl/v1-wave1-authoritative-transactions
