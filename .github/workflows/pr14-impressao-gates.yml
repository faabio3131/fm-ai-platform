name: PR14 Impressao Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python, Ruff, mypy e spool
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR14
        run: >-
          ruff check core/impressao migrations/impressao_v1.py
          tests/unit/impressao tests/integration/impressao
          core/seguranca/permissoes.py
      - name: mypy PR14
        run: >-
          mypy core/impressao migrations/impressao_v1.py
          tests/unit/impressao tests/integration/impressao
      - name: Testes focados PR14
        run: pytest -q tests/unit/impressao tests/integration/impressao
      - name: Suite Python completa
        run: pytest -q
