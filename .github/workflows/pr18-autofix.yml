name: PR18 Autofix Temporario

on:
  push:
    branches: [codex/implementar-adapters-marketplace-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-adapters-marketplace-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir tipagem conhecida
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/marketplaces/ifood_http.py')
          s = p.read_text()
          s = s.replace(
              'from .modelos import (\n    EventoMarketplaceExterno,',
              'from .modelos import (\n    CapacidadeMarketplace,\n    CapacidadesMarketplace,\n    EventoMarketplaceExterno,',
              1,
          )
          s = s.replace(
              '    def capacidades(self):\n        return IFOOD_CAPACIDADES',
              '    def capacidades(self) -> CapacidadesMarketplace:\n        return IFOOD_CAPACIDADES',
              1,
          )
          p.write_text(s)
          PY
      - name: Ruff autofix
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/marketplaces tests/contract/marketplaces/test_adapters_pr18.py --fix
          ruff check core/marketplaces tests/contract/marketplaces/test_adapters_pr18.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/marketplaces tests/contract/marketplaces/test_adapters_pr18.py
          git diff --cached --quiet || git commit -m 'chore(marketplace): aplicar autofix PR18'
          git push origin HEAD:codex/implementar-adapters-marketplace-v1
