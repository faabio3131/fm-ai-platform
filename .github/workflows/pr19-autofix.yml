name: PR19 Autofix Temporario

on:
  push:
    branches: [codex/implementar-crm-conversao-consentida-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-crm-conversao-consentida-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar Ruff autofix PR19
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/crm tests/unit/crm tests/integration/crm --fix
          ruff check core/crm tests/unit/crm tests/integration/crm
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/crm tests/unit/crm tests/integration/crm
          git diff --cached --quiet || git commit -m 'chore(crm): aplicar ruff autofix PR19'
          git push origin HEAD:codex/implementar-crm-conversao-consentida-v1
