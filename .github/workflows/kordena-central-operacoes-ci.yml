name: Kordena Central de Operacoes CI
# Certification rerun requested after Actions quota change

on:
  push:
    branches:
      - feat/kordena-v1-central-operacoes-isolada
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/kordena-central-operacoes-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kordena-operations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: TypeScript
        run: npx tsc --noEmit --incremental false
      - name: ESLint
        run: npm run lint
      - name: Operations board contract tests
        run: node --test tests/operations-board.contract.test.mjs
      - name: Production build
        run: npm run build
      - name: Check route generated
        run: test -f .next/BUILD_ID && test -d .next/server/app/central-operacoes
      - name: Install browser test runner
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start application and run browser tests
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/kordena-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          node tests/operations-board.browser.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kordena-operations-browser-screenshots
          path: |
            web/operations-board-desktop.png
            web/operations-board-mobile.png
          if-no-files-found: ignore

  backend-real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Authenticate and list real orders in isolated test database
        run: python -m pytest tests/api/test_central_operacoes_real_api.py -q

  integrated-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test backend
        run: python -m pip install -r requirements.txt pytest
      - name: Install frontend
        working-directory: web
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build frontend pointing only to local FastAPI
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Chromium test browser
        working-directory: web
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Real full-stack E2E (isolated SQLite, signed session, seeded order)
        env:
          KORDENA_DEMO_ISOLATED: '1'
        working-directory: web
        run: |
          python ../tests/api/serve_central_operacoes_e2e.py > /tmp/kordena-api-e2e.log 2>&1 &
          API_PID=$!
          npm run start -- --hostname 127.0.0.1 > /tmp/kordena-web-e2e.log 2>&1 &
          WEB_PID=$!
          trap 'kill $API_PID $WEB_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null && curl -fsS http://127.0.0.1:3000/login >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/openapi.json >/dev/null || { cat /tmp/kordena-api-e2e.log; exit 1; }
          curl -fsS http://127.0.0.1:3000/login >/dev/null || { cat /tmp/kordena-web-e2e.log; exit 1; }
          node tests/operations-board.integrated.mjs || { cat /tmp/kordena-api-e2e.log; cat /tmp/kordena-web-e2e.log; exit 1; }
      - name: Upload integrated screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kordena-operations-integrated-e2e
          path: |
            web/operations-board-integrated-desktop.png
            web/operations-board-integrated-mobile.png
          if-no-files-found: ignore
