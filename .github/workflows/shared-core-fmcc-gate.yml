name: Shared Core FMCC Gate

on:
  pull_request:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - "application/fmcc_core_service.py"
      - "application/ai_router_runtime.py"
      - "core/ai_router.py"
      - "http_api/app.py"
      - "http_api/fmcc_core.py"
      - "tests/api/test_fmcc_core_http_contract.py"
      - "tests/unit/gerente_ia/test_fmcc_shared_core_service.py"
      - ".github/workflows/shared-core-fmcc-gate.yml"

permissions:
  contents: read

concurrency:
  group: shared-core-fmcc-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  shared-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Compile shared Core boundary
        run: |
          python -m compileall -q             application/fmcc_core_service.py             http_api/fmcc_core.py             core/ai_router.py             application/ai_router_runtime.py

      - name: Ruff shared Core boundary
        run: |
          ruff check             application/fmcc_core_service.py             http_api/fmcc_core.py             core/ai_router.py             application/ai_router_runtime.py             tests/api/test_fmcc_core_http_contract.py             tests/unit/gerente_ia/test_fmcc_shared_core_service.py

      - name: Shared Core contract tests
        run: |
          pytest -q             tests/unit/gerente_ia/test_fmcc_shared_core_service.py             tests/api/test_fmcc_core_http_contract.py             tests/unit/ai_router/test_router.py             tests/fitness/test_af15_ai_model_router.py
