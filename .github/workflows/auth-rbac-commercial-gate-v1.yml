name: Auth RBAC Commercial Gate V1

on:
  push:
    branches:
      - main
      - "recovery/v1-fase14*"
    paths:
      - "infra/streamlit_app/auth_ui.py"
      - "infra/streamlit_app/sensitive_idle_watchdog.py"
      - "pages/6_Administracao_Proprietario.py"
      - "pages/7_Integracoes_e_Credenciais.py"
      - "core/seguranca/**"
      - "infra/seguranca/**"
      - "core/gerente_ia/**"
      - "core/pdv/**"
      - "core/kds/**"
      - "core/salao/**"
      - "core/crm/**"
      - "core/pagamentos/**"
      - "tests/unit/security/**"
      - "tests/integration/security/**"
      - "tests/unit/gerente_ia/**"
      - "tests/unit/pdv/**"
      - "tests/unit/kds/**"
      - "tests/unit/salao/**"
      - "tests/unit/crm/**"
      - "tests/unit/payments/**"
      - "tests/fitness/test_auth_sensitive_entrypoints_v1.py"
      - "tests/fitness/test_f14_transversal_rbac_security_v1.py"
      - ".github/workflows/auth-rbac-commercial-gate-v1.yml"
  pull_request:
    branches:
      - main
    paths:
      - "infra/streamlit_app/auth_ui.py"
      - "infra/streamlit_app/sensitive_idle_watchdog.py"
      - "pages/6_Administracao_Proprietario.py"
      - "pages/7_Integracoes_e_Credenciais.py"
      - "core/seguranca/**"
      - "infra/seguranca/**"
      - "core/gerente_ia/**"
      - "core/pdv/**"
      - "core/kds/**"
      - "core/salao/**"
      - "core/crm/**"
      - "core/pagamentos/**"
      - "tests/unit/security/**"
      - "tests/integration/security/**"
      - "tests/unit/gerente_ia/**"
      - "tests/unit/pdv/**"
      - "tests/unit/kds/**"
      - "tests/unit/salao/**"
      - "tests/unit/crm/**"
      - "tests/unit/payments/**"
      - "tests/fitness/test_auth_sensitive_entrypoints_v1.py"
      - "tests/fitness/test_f14_transversal_rbac_security_v1.py"
      - ".github/workflows/auth-rbac-commercial-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-rbac:
    name: Auth/RBAC commercial gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile auth and transversal security surface
        run: |
          python -m py_compile \
            infra/streamlit_app/auth_ui.py \
            infra/streamlit_app/sensitive_idle_watchdog.py \
            pages/6_Administracao_Proprietario.py \
            pages/7_Integracoes_e_Credenciais.py \
            tests/fitness/test_auth_sensitive_entrypoints_v1.py \
            tests/fitness/test_f14_transversal_rbac_security_v1.py
      - name: Ruff auth and transversal security surface
        run: |
          ruff check \
            core/seguranca/autorizacao.py \
            core/seguranca/contexto.py \
            core/seguranca/permissoes.py \
            core/gerente_ia/tools.py \
            infra/streamlit_app/auth_ui.py \
            infra/streamlit_app/sensitive_idle_watchdog.py \
            pages/6_Administracao_Proprietario.py \
            pages/7_Integracoes_e_Credenciais.py \
            tests/unit/security/test_authentication_v1.py \
            tests/unit/security/test_sensitive_admin_access_v1.py \
            tests/integration/security/test_admin_pin_v1.py \
            tests/fitness/test_auth_sensitive_entrypoints_v1.py \
            tests/fitness/test_f14_transversal_rbac_security_v1.py
      - name: Mypy auth surface
        run: |
          mypy \
            core/seguranca \
            infra/seguranca \
            infra/streamlit_app/auth_ui.py \
            infra/streamlit_app/sensitive_idle_watchdog.py
      - name: Targeted auth and transversal RBAC tests
        run: |
          pytest -q \
            tests/unit/security \
            tests/integration/security \
            tests/fitness/test_auth_sensitive_entrypoints_v1.py \
            tests/fitness/test_f14_transversal_rbac_security_v1.py
      - name: Full Python regression
        run: pytest -q
