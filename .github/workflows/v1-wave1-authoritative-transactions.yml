name: V1 Wave1 Authoritative Transactions

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
  pull_request:
    branches: [impl/v1-wave0-production-foundation]
    paths:
      - 'core/pedidos/**'
      - 'core/pagamentos/**'
      - 'core/estoque/**'
      - 'core/eventos/**'
      - 'core/dominio/**'
      - 'core/estados/**'
      - 'infra/eventos/**'
      - 'infra/transacoes/**'
      - 'infra/seguranca/**'
      - 'migrations/**'
      - 'tests/integration/wave1/**'
      - 'tests/unit/events/**'
      - 'tests/unit/runtime/**'
      - '.github/workflows/v1-wave1-authoritative-transactions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave1:
    name: Pedido, Pagamento, Estoque e Eventos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compilar Onda 1
        run: >-
          python -m compileall -q core/pedidos core/pagamentos core/estoque core/eventos
          core/dominio core/estados infra/eventos infra/transacoes infra/seguranca migrations
      - name: Ruff Onda 1
        run: >-
          ruff check core/pedidos core/pagamentos core/estoque core/eventos core/dominio
          core/estados infra/eventos infra/transacoes infra/seguranca migrations/runner.py
          tests/integration/wave1 tests/unit/events tests/unit/runtime/test_runtime_foundation.py
      - name: Testes focados Onda 1
        run: >-
          pytest -q tests/integration/wave1 tests/unit/events
          tests/unit/orders tests/unit/payments tests/unit/stock
          tests/unit/runtime/test_runtime_foundation.py
      - name: Suite Python completa
        run: pytest -q
