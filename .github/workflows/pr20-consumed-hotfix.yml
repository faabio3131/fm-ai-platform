name: PR20 Consumed Preview Hotfix

on:
  push:
    branches: [codex/implementar-gerente-ia-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-gerente-ia-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bloquear preview consumido antes da revalidacao
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/gerente_ia/servicos.py')
          s = p.read_text()
          s = s.replace(
              '    ResultadoTool,\n    ToolGerenteIA,\n',
              '    ResultadoTool,\n    StatusPreview,\n    ToolGerenteIA,\n',
              1,
          )
          alvo = '''        if existente is not None:\n            if existente.preview_id != preview_id:\n                raise ErroGerenteIA("conflito_idempotencia")\n            return replace(existente, idempotente=True)\n\n        self._exigir(\n'''
          novo = '''        if existente is not None:\n            if existente.preview_id != preview_id:\n                raise ErroGerenteIA("conflito_idempotencia")\n            return replace(existente, idempotente=True)\n        if preview.status is not StatusPreview.PENDENTE:\n            raise ErroGerenteIA("preview_ja_consumido")\n\n        self._exigir(\n'''
          if alvo not in s:
              raise SystemExit('alvo nao encontrado')
          p.write_text(s.replace(alvo, novo, 1))
          PY
      - name: Validar
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff==0.16.1 mypy==1.20.2
          ruff check core/gerente_ai.py core/gerente_ia tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia
          mypy core/gerente_ai.py core/gerente_ia
          pytest -q tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/gerente_ia/servicos.py
          git diff --cached --quiet || git commit -m 'fix(gerente-ia): bloquear reutilizacao de preview consumido'
          git push origin HEAD:codex/implementar-gerente-ia-v1
