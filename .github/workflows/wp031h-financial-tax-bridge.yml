name: WP-031H Financial Tax Bridge

on:
  pull_request:
    paths:
      - 'core/pagamentos/**'
      - 'core/seguranca/permissoes.py'
      - 'migrations/**'
      - 'tests/integration/fiscal/test_wp031h_financial_tax_bridge.py'
      - 'tests/integration/runtime/**'
      - 'tests/unit/runtime/**'
      - 'docs/web-parity/**'
      - '.github/workflows/wp031h-financial-tax-bridge.yml'
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'core/pagamentos/**'
      - 'core/seguranca/permissoes.py'
      - 'migrations/**'
      - 'tests/integration/fiscal/test_wp031h_financial_tax_bridge.py'
      - 'tests/integration/runtime/**'
      - 'tests/unit/runtime/**'
      - 'docs/web-parity/**'
      - '.github/workflows/wp031h-financial-tax-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  financial-tax-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Verify frozen Fiscal V1 baseline
        run: python scripts/validate_wp031_vendor_baseline.py
      - name: Compile bridge
        run: |
          python -m py_compile \
            core/pagamentos/fiscal_bridge.py \
            core/pagamentos/fiscal_bridge_sqlalchemy.py \
            core/pagamentos/modelos_orm.py \
            migrations/fiscal_financial_tax_bridge_v1.py \
            migrations/runner.py
      - name: Ruff
        run: |
          ruff check \
            core/pagamentos \
            core/seguranca/permissoes.py \
            migrations/fiscal_financial_tax_bridge_v1.py \
            migrations/runner.py \
            tests/integration/fiscal/test_wp031h_financial_tax_bridge.py
      - name: Mypy
        run: |
          mypy \
            core/pagamentos/fiscal_bridge.py \
            core/pagamentos/fiscal_bridge_sqlalchemy.py \
            --follow-imports=skip
      - name: Migration manifest
        run: |
          python - <<'PY'
          from migrations.manifest import assert_migration_manifest
          from migrations.runner import DEFAULT_MIGRATIONS
          assert_migration_manifest(DEFAULT_MIGRATIONS)
          print("Migration manifest: PASS")
          PY
      - name: Schema baseline
        run: python scripts/generate_schema_baseline_v1.py --check
      - name: Financial, fiscal and runtime regression
        run: |
          pytest -q \
            tests/integration/fiscal \
            tests/integration/payments \
            tests/unit/payments \
            tests/fitness/test_af04_schema_convergence.py \
            tests/fitness/test_af05_migration_manifest.py \
            tests/fitness/test_af09_rbac_capability_matrix.py
      - name: Full Python regression
        run: pytest -q
      - name: Diff whitespace gate
        run: git diff --check 4f39732acec8f6b56b169e684642310bbab5cf6d..HEAD
