name: F11-E Readiness Reconcile Once

on:
  push:
    branches:
      - feat/f11-e-ui-comercial-delivery
    paths:
      - .github/workflows/f11e-readiness-reconcile-once.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f11-e-ui-comercial-delivery
          fetch-depth: 0
      - name: Reconciliar somente blockers resolvidos pela F11-E
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("docs/commercial_runtime_readiness_v1.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          delivery = data["modules"]["delivery_proprio"]
          esperado = {"delivery_runtime_teste", "delivery_demo_scope"}
          if set(delivery.get("code_blockers", [])) != esperado:
              raise SystemExit(
                  "f11e_readiness_blockers_divergentes="
                  + repr(delivery.get("code_blockers"))
              )
          delivery["status"] = "COMMERCIAL_CANDIDATE"
          delivery["commercial_paths"] = [
              "core/delivery/ui_streamlit.py",
              "application/delivery_operacao_comercial.py",
              "application/delivery_contexto_comercial.py",
              "application/delivery_checkout_comercial.py",
              "infra/delivery/carrinhos_sqlalchemy.py",
              "app.py",
          ]
          delivery["code_blockers"] = []
          delivery["evidence"] = {
              "sha": None,
              "commercial_runtime_e2e": None,
              "physical_test": None,
          }
          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commitar checkpoint e remover mecanismo temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f11e-readiness-reconcile-once.yml
          git add docs/commercial_runtime_readiness_v1.json
          git commit -m "docs(f11-e): mark Delivery Próprio commercial candidate"
          git push origin HEAD:feat/f11-e-ui-comercial-delivery
