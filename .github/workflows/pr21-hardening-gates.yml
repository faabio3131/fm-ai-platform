name: PR21 Hardening Gate E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-python:
    name: Hardening, segurança, carga e Gate E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR21
        run: >-
          ruff check core/hardening
          tests/unit/hardening
          tests/integration/hardening
          tests/contract/hardening
          tests/security/hardening
      - name: mypy PR21
        run: mypy core/hardening
      - name: Contratos e segurança Gate E
        run: >-
          pytest -q
          tests/unit/hardening
          tests/integration/hardening
          tests/contract/hardening
          tests/security/hardening
      - name: Suite Python completa
        run: pytest -q

  hardening-accessibility:
    name: Acessibilidade browser-driven
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Instalar dependencias Node
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Rodar smoke de acessibilidade
        run: >-
          npx playwright test tests/e2e/hardening-accessibility.spec.ts
          -c playwright.config.ts --reporter=list
