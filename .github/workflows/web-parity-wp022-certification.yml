name: Web Parity WP022 Certification

on:
  pull_request:
    paths:
      - "http_api/admin_empresa.py"
      - "http_api/frontend_app.py"
      - "web/src/app/admin/empresa/**"
      - "web/src/features/backoffice/empresa/**"
      - "tests/api/test_admin_empresa_http_contract.py"
      - "tests/api/test_admin_backoffice_http_contract.py"
      - "tests/api/test_auth_admin_stepup_http_contract.py"
      - "docs/web-parity/**"
      - ".github/workflows/web-parity-wp022-certification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-wp022:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile WP022 surface
        run: |
          python -m py_compile \
            http_api/admin_empresa.py \
            http_api/frontend_app.py
      - name: Ruff WP022
        run: |
          ruff check \
            http_api/admin_empresa.py \
            http_api/frontend_app.py \
            tests/api/test_admin_empresa_http_contract.py \
            tests/api/test_admin_backoffice_http_contract.py \
            tests/api/test_auth_admin_stepup_http_contract.py
      - name: Mypy WP022
        run: |
          mypy --follow-imports=silent \
            http_api/admin_empresa.py \
            http_api/frontend_app.py
      - name: WP022 HTTP contract and security regression
        run: pytest -q tests/api/test_admin_empresa_http_contract.py tests/api/test_admin_backoffice_http_contract.py tests/api/test_auth_admin_stepup_http_contract.py
      - name: Full Python regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: ESLint WP022
        working-directory: web
        run: |
          npx eslint \
            src/app/admin/empresa/page.tsx \
            src/features/backoffice/empresa/components/EmpresaWorkspace.tsx \
            src/features/backoffice/empresa/services/empresa-api.ts
      - name: Frontend typecheck
        working-directory: web
        run: npx tsc --noEmit --incremental false
      - name: Frontend build
        working-directory: web
        run: npm run build
      - name: Diff whitespace gate
        run: git diff --check origin/${{ github.base_ref }}...HEAD
