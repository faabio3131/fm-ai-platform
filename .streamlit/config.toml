[theme]
base = "dark"
primaryColor = "#F97316"
backgroundColor = "#090D12"
secondaryBackgroundColor = "#111820"
textColor = "#F5F7FA"
linkColor = "#FDBA74"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["2.35rem", "1.80rem", "1.42rem", "1.18rem", "1.00rem", "0.90rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
baseRadius = "0.80rem"
buttonRadius = "0.70rem"
borderColor = "#29313A"
dataframeBorderColor = "#2F3944"
dataframeHeaderBackgroundColor = "#161F29"
showWidgetBorder = true
showSidebarBorder = true
codeBackgroundColor = "#0D141B"
codeTextColor = "#FED7AA"
redColor = "#FB7185"
orangeColor = "#F97316"
yellowColor = "#FBBF24"
greenColor = "#34D399"
blueColor = "#60A5FA"
violetColor = "#A78BFA"
grayColor = "#94A3B8"
chartCategoricalColors = ["#F97316", "#60A5FA", "#34D399", "#A78BFA", "#FBBF24", "#FB7185", "#38BDF8", "#C084FC"]
chartSequentialColors = ["#431407", "#7C2D12", "#9A3412", "#C2410C", "#EA580C", "#F97316", "#FB923C", "#FDBA74", "#FED7AA", "#FFF7ED"]

[theme.sidebar]
primaryColor = "#FB923C"
backgroundColor = "#0C1117"
secondaryBackgroundColor = "#151D26"
textColor = "#E8EDF3"
linkColor = "#FDBA74"
borderColor = "#25303A"
dataframeBorderColor = "#2C3742"
dataframeHeaderBackgroundColor = "#17212B"
showWidgetBorder = true
baseRadius = "0.75rem"
buttonRadius = "0.65rem"
