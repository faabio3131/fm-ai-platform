name: PR20 Autofix Temporario

on:
  push:
    branches: [codex/implementar-gerente-ia-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-gerente-ia-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ruff autofix PR20
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/gerente_ai.py core/gerente_ia tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia --fix
          ruff check core/gerente_ai.py core/gerente_ia tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/gerente_ai.py core/gerente_ia tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia
          git diff --cached --quiet || git commit -m 'chore(gerente-ia): aplicar ruff autofix PR20'
          git push origin HEAD:codex/implementar-gerente-ia-v1
