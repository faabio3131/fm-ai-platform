name: Fase 6C Legacy Projection Containment Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'application/pdv_legacy_projection.py'
      - 'application/finalizacao_pagamento.py'
      - 'application/legacy_stock_projection.py'
      - 'core/pdv/**'
      - 'tests/integration/pdv/**'
      - 'tests/fitness/test_f6c_legacy_projection_containment.py'
      - 'docs/system-design-fase6c-legacy-projection-containment-v1.md'
      - 'docs/inventario-fase6-pdv-pedido-pagamento-estoque-v1.md'
      - '.github/workflows/fase6c-legacy-projection-containment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f6c:
    name: Legacy como projeção, nunca autoridade
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compilar F6-C
        run: >-
          python -m compileall -q
          application/pdv_legacy_projection.py
          application/finalizacao_pagamento.py
          core/pdv
          tests/integration/pdv
          tests/fitness/test_f6c_legacy_projection_containment.py
      - name: Ruff F6-C
        run: >-
          ruff check
          application/pdv_legacy_projection.py
          application/finalizacao_pagamento.py
          core/pdv/repositorios.py
          core/pdv/adaptadores_sqlalchemy.py
          core/pdv/cutover_canonico.py
          core/pdv/executor_canonico.py
          tests/integration/pdv/helpers.py
          tests/fitness/test_f6c_legacy_projection_containment.py
      - name: Mypy F6-C
        run: >-
          mypy
          application/pdv_legacy_projection.py
          application/finalizacao_pagamento.py
          core/pdv
      - name: Fitness de contenção
        run: pytest -q tests/fitness/test_f6c_legacy_projection_containment.py
      - name: Regressões autoritativas
        run: >-
          pytest -q
          tests/integration/pdv/test_canary_integrado.py
          tests/integration/pdv/test_pix_async_finalizer.py
          tests/integration/pdv/test_zero_total.py
          tests/integration/pdv/test_rollback.py
