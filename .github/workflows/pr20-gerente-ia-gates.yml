name: PR20 Gerente IA Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gerente-ia:
    name: Gerente IA V1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR20
        run: >-
          ruff check core/gerente_ai.py core/gerente_ia core/assistente_atendimento
          application/gerente_ia_runtime.py infra/gerente_ia http_api/app.py
          tests/unit/gerente_ia tests/integration/gerente_ia tests/contract/gerente_ia
      - name: mypy PR20
        run: >-
          mypy core/gerente_ai.py core/gerente_ia core/assistente_atendimento
          application/gerente_ia_runtime.py infra/gerente_ia http_api/app.py
      - name: Testes focados PR20
        run: >-
          pytest -q tests/unit/gerente_ia tests/integration/gerente_ia
          tests/contract/gerente_ia
      - name: Suite Python completa
        run: pytest -q
