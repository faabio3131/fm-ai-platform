name: F11-E Ruff Fix Once

on:
  push:
    branches:
      - feat/f11-e-ui-comercial-delivery
    paths:
      - .github/workflows/f11e-ruff-fix-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f11-e-ui-comercial-delivery
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir somente os três I001 reportados pelo PR16
        run: |
          python -m pip install --disable-pip-version-check ruff==0.16.1
          ruff check --fix \
            core/delivery/ui_streamlit.py \
            tests/fitness/test_f11e_delivery_ui_comercial.py \
            tests/unit/delivery/test_operacao_comercial_f11e.py
          ruff check \
            core/delivery/ui_streamlit.py \
            tests/fitness/test_f11e_delivery_ui_comercial.py \
            tests/unit/delivery/test_operacao_comercial_f11e.py
      - name: Commitar correção e remover mecanismo temporário
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/f11e-ruff-fix-once.yml
          git add core/delivery/ui_streamlit.py \
            tests/fitness/test_f11e_delivery_ui_comercial.py \
            tests/unit/delivery/test_operacao_comercial_f11e.py
          git commit -m "style(f11-e): normalize Delivery commercial imports"
          git push origin HEAD:feat/f11-e-ui-comercial-delivery
