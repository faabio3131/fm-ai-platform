name: Fase 7C Salao Canonical Payment Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/salao_transacoes.py'
      - 'core/salao/**'
      - 'core/pagamentos/**'
      - 'tests/integration/salao/**'
      - 'tests/integration/payments/**'
      - 'tests/fitness/test_f7_commercial_salao_garcom_boundary.py'
      - 'docs/inventario-fase7-salao-garcom-v1.md'
      - '.github/workflows/fase7c-salao-payment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f7c:
    name: Canonical payment + projection + close
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2

      - name: Compile F7-C
        run: |
          python -m compileall -q \
            application/salao_transacoes.py \
            core/salao \
            tests/integration/salao/test_commercial_payment_composition.py \
            tests/fitness/test_f7_commercial_salao_garcom_boundary.py

      - name: Ruff F7-C
        run: |
          ruff check \
            application/salao_transacoes.py \
            core/salao \
            tests/integration/salao/test_commercial_payment_composition.py \
            tests/fitness/test_f7_commercial_salao_garcom_boundary.py

      - name: Mypy F7-C
        run: mypy application/salao_transacoes.py core/salao

      - name: Fitness commercial boundary
        run: pytest -q tests/fitness/test_f7_commercial_salao_garcom_boundary.py

      - name: Pagamento canônico do Salão
        run: pytest -q tests/integration/salao/test_commercial_payment_composition.py

      - name: Regressões Salão + Pagamentos
        run: |
          pytest -q \
            tests/unit/salao \
            tests/integration/salao \
            tests/integration/payments
