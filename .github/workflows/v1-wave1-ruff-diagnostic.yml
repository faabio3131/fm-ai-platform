name: V1 Wave1 Ruff Diagnostic

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - '.github/workflows/v1-wave1-ruff-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v1-wave1-authoritative-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Ruff
        run: pip install ruff==0.16.1
      - name: Capturar diagnóstico completo
        shell: bash
        run: |
          set +e
          ruff check core/pedidos core/pagamentos core/estoque core/eventos core/dominio core/estados infra/eventos infra/transacoes infra/seguranca migrations/runner.py tests/integration/wave1 tests/unit/events tests/unit/runtime/test_runtime_foundation.py > ruff-wave1-report.txt 2>&1
          code=$?
          echo "exit_code=$code" >> ruff-wave1-report.txt
          cat ruff-wave1-report.txt
          exit 0
      - name: Publicar relatório temporário
        run: |
          git config user.name "fm-ai-wave1-diagnostic"
          git config user.email "fm-ai-wave1-diagnostic@users.noreply.github.com"
          git add ruff-wave1-report.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Wave1 Ruff diagnostics"
          git fetch origin impl/v1-wave1-authoritative-transactions
          git rebase origin/impl/v1-wave1-authoritative-transactions
          git push origin HEAD:impl/v1-wave1-authoritative-transactions
