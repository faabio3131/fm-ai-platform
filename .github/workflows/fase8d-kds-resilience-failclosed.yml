name: Fase 8D KDS Resilience Fail Closed Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'application/kds_*.py'
      - 'core/kds/**'
      - 'infra/transacoes/**'
      - 'tests/integration/kds/**'
      - 'tests/integration/wave2/**'
      - 'tests/fitness/test_f8_kds_commercial_boundary.py'
      - 'docs/inventario-fase8-kds-commercial-v1.md'
      - '.github/workflows/fase8d-kds-resilience-failclosed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resilience:
    name: Multi-setor + CAS + replay + fail-closed + isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile F8-D
        run: >-
          python -m compileall -q
          application/kds_runtime.py
          application/kds_runtime_core.py
          application/kds_runtime_support.py
          application/kds_transacoes.py
          core/kds infra/transacoes
          tests/integration/kds/test_kds.py
          tests/integration/wave2/test_kds_transaction_ownership.py
      - name: Ruff F8-D
        run: >-
          ruff check
          application/kds_runtime.py
          application/kds_runtime_core.py
          application/kds_runtime_support.py
          application/kds_transacoes.py
          core/kds infra/transacoes
          tests/integration/kds/test_kds.py
          tests/integration/wave2/test_kds_transaction_ownership.py
      - name: Mypy F8-D
        run: >-
          mypy
          application/kds_runtime.py
          application/kds_runtime_core.py
          application/kds_runtime_support.py
          application/kds_transacoes.py
          core/kds infra/transacoes
      - name: Resiliência KDS
        run: pytest -q tests/integration/kds/test_kds.py
      - name: Ownership e rollback Application
        run: pytest -q tests/integration/wave2/test_kds_transaction_ownership.py
      - name: Fitness commercial boundary
        run: pytest -q tests/fitness/test_f8_kds_commercial_boundary.py
