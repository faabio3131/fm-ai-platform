name: Web Parity WP032 Notificacoes

on:
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'application/notificacoes_internas_admin.py'
      - 'infra/notificacoes_internas/**'
      - 'http_api/admin_notificacoes.py'
      - 'http_api/frontend_app.py'
      - 'web/src/app/admin/notificacoes/**'
      - 'web/src/features/backoffice/notificacoes/**'
      - 'web/src/features/shell/module-registry.ts'
      - 'tests/api/test_admin_notificacoes_http_contract.py'
      - 'web/tests/wp032-notificacoes-navigation.test.mjs'
      - '.github/workflows/web-parity-wp032-notificacoes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp032:
    name: WP032 internal notifications Web gate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile WP032
        run: python -m compileall -q application/notificacoes_internas_admin.py infra/notificacoes_internas http_api/admin_notificacoes.py
      - name: Ruff WP032
        run: ruff check application/notificacoes_internas_admin.py infra/notificacoes_internas http_api/admin_notificacoes.py tests/api/test_admin_notificacoes_http_contract.py
      - name: Mypy WP032
        run: mypy application/notificacoes_internas_admin.py infra/notificacoes_internas http_api/admin_notificacoes.py
      - name: WP032 targeted matrix
        run: pytest -q tests/api/test_admin_notificacoes_http_contract.py
      - name: Full Python regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: ESLint WP032
        working-directory: web
        run: npx eslint src/app/admin/notificacoes/page.tsx src/features/backoffice/notificacoes src/features/shell/module-registry.ts
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Navigation tests
        working-directory: web
        run: |
          node --test tests/backoffice-navigation.test.mjs
          node --test tests/wp032-notificacoes-navigation.test.mjs
      - name: Next production build
        working-directory: web
        run: npm run build
      - name: Diff whitespace gate
        run: git diff --check origin/${{ github.event.repository.default_branch }}...HEAD
