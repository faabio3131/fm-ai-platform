name: PR13 Entrega Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Python, Ruff e mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR13
        run: ruff check core/entrega tests/unit/entrega
      - name: mypy PR13
        run: mypy core/entrega tests/unit/entrega
      - name: Testes focados PR13
        run: pytest -q tests/unit/entrega
      - name: Suite Python completa
        run: pytest -q
