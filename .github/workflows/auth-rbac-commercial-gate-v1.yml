name: Auth RBAC Commercial Gate V1

on:
  push:
    branches:
      - "fix/v1-auth-streamlit-login-input"
    paths:
      - "infra/streamlit_app/auth_ui.py"
      - "infra/streamlit_app/sensitive_idle_watchdog.py"
      - "pages/6_Administracao_Proprietario.py"
      - "pages/7_Integracoes_e_Credenciais.py"
      - "core/seguranca/**"
      - "infra/seguranca/**"
      - "tests/unit/security/**"
      - "tests/integration/security/**"
      - "tests/fitness/test_auth_sensitive_entrypoints_v1.py"
      - ".github/workflows/auth-rbac-commercial-gate-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-rbac:
    name: Auth/RBAC commercial gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile auth surface
        run: |
          python -m py_compile             infra/streamlit_app/auth_ui.py             pages/6_Administracao_Proprietario.py             pages/7_Integracoes_e_Credenciais.py             tests/fitness/test_auth_sensitive_entrypoints_v1.py
      - name: Ruff auth surface
        run: |
          ruff check             infra/streamlit_app/auth_ui.py             pages/6_Administracao_Proprietario.py             pages/7_Integracoes_e_Credenciais.py             tests/unit/security/test_authentication_v1.py             tests/unit/security/test_sensitive_admin_access_v1.py             tests/integration/security/test_admin_pin_v1.py             tests/fitness/test_auth_sensitive_entrypoints_v1.py
      - name: Mypy auth surface
        run: |
          mypy             infra/streamlit_app/auth_ui.py             core/seguranca             infra/seguranca
      - name: Targeted auth and sensitive-area tests
        run: |
          pytest -q             tests/unit/security/test_authentication_v1.py             tests/unit/security/test_sensitive_admin_access_v1.py             tests/integration/security/test_admin_pin_v1.py             tests/fitness/test_auth_sensitive_entrypoints_v1.py
