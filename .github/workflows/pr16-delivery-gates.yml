name: PR16 Delivery Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python, Ruff, mypy e contratos Delivery
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Ruff PR16
        run: >-
          ruff check core/delivery application/delivery_composicao.py
          application/delivery_contexto_comercial.py
          application/delivery_checkout_comercial.py
          application/delivery_operacao_comercial.py
          infra/delivery/carrinhos_sqlalchemy.py infra/delivery/catalogo_sqlalchemy.py
          infra/crm/clientes_sqlalchemy.py migrations/delivery_channel_state_v1.py
          tests/unit/delivery tests/integration/delivery
          tests/fitness/test_commercial_runtime_readiness_v1.py
          tests/fitness/test_f11b_delivery_commercial_state.py
          tests/fitness/test_f11c_delivery_commercial_context.py
          tests/fitness/test_f11d_delivery_checkout_beneficios.py
          tests/fitness/test_f11e_delivery_ui_comercial.py
          tests/fitness/test_f11f_delivery_commercial_runtime.py
          tests/fitness/test_f11g_delivery_readiness_closure.py
      - name: mypy PR16
        run: >-
          mypy core/delivery application/delivery_composicao.py
          application/delivery_contexto_comercial.py
          application/delivery_checkout_comercial.py
          application/delivery_operacao_comercial.py
          infra/delivery/carrinhos_sqlalchemy.py infra/delivery/catalogo_sqlalchemy.py
          infra/crm/clientes_sqlalchemy.py migrations/delivery_channel_state_v1.py
      - name: Testes focados PR16
        run: >-
          pytest -q tests/unit/delivery tests/integration/delivery
          tests/fitness/test_commercial_runtime_readiness_v1.py
          tests/fitness/test_f11b_delivery_commercial_state.py
          tests/fitness/test_f11c_delivery_commercial_context.py
          tests/fitness/test_f11d_delivery_checkout_beneficios.py
          tests/fitness/test_f11e_delivery_ui_comercial.py
          tests/fitness/test_f11f_delivery_commercial_runtime.py
          tests/fitness/test_f11g_delivery_readiness_closure.py
      - name: Suite Python completa
        run: pytest -q

  e2e-delivery:
    name: E2E jornada Delivery Próprio
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Instalar dependencias Node
        run: npm ci
      - name: Instalar Chromium
        run: npx playwright install chromium
      - name: Rodar E2E Delivery
        env:
          FM_AI_TEST_MODE: '1'
          FM_AI_DELIVERY_V1: '1'
        run: npx playwright test -c playwright.delivery.config.ts --reporter=list
