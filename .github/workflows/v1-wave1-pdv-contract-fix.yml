name: V1 Wave1 PDV Canonical Contract Fix

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - '.github/workflows/v1-wave1-pdv-contract-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v1-wave1-authoritative-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir contrato e expectativas de cutover
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: esperado 1 trecho; encontrado {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'core/pdv/executor_canonico.py',
              '''            recursos.registrar_efeitos(\n                eventos=reconhecida.eventos, auditorias=reconhecida.auditorias\n            )''',
              '''            recursos.registrar_efeitos(\n                eventos=(reconhecida.evento,), auditorias=(reconhecida.auditoria,)\n            )''',
          )
          replace_once(
              'tests/integration/pdv/test_pix_producao.py',
              'assert resultado.motivo == "aguardando_confirmacao_pix"',
              'assert resultado.motivo == "aguardando_confirmacao_financeira"',
          )
          replace_once(
              'tests/integration/pdv/test_rollback.py',
              '''PONTOS = (\n    "after_pedido",\n    "after_pagamento",\n    "after_confirmacao",\n    "after_venda_financeira",\n    "after_venda_legada",\n    "after_estoque",\n    "after_cashback",\n    "before_reconciliacao",\n    "before_commit",\n)''',
              '''PONTOS = (\n    "after_checkout_canonico",\n    "after_confirmacao",\n    "after_estoque_canonico",\n    "after_venda_financeira",\n    "after_projecoes_legadas",\n    "before_reconciliacao",\n    "before_commit",\n)''',
          )
          PY
      - name: Validar PDV focal
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff==0.16.1
          ruff check core/pdv/executor_canonico.py tests/integration/pdv/test_pix_producao.py tests/integration/pdv/test_rollback.py
          pytest -q tests/integration/pdv --tb=short
      - name: Commitar correção validada
        run: |
          git diff --check
          git config user.name "fm-ai-wave1-bot"
          git config user.email "fm-ai-wave1-bot@users.noreply.github.com"
          git add core/pdv/executor_canonico.py tests/integration/pdv/test_pix_producao.py tests/integration/pdv/test_rollback.py
          git commit -m "V1 Wave1 PDV-001: align canonical sale effects and rollback points"
          git fetch origin impl/v1-wave1-authoritative-transactions
          git rebase origin/impl/v1-wave1-authoritative-transactions
          git push origin HEAD:impl/v1-wave1-authoritative-transactions
