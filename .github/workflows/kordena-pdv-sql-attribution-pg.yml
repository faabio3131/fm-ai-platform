name: Kordena PDV SQL 70 Attribution Diagnostic

on:
  pull_request:
    branches:
      - staging/kordena-premium
    paths:
      - scripts/diagnose_pdv_checkout_sql_attribution_pg.py
      - .github/workflows/kordena-pdv-sql-attribution-pg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-pdv-attribution:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kordena_pdv_profile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kordena_pdv_profile"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Verify diagnostic syntax
        run: |
          python -m py_compile scripts/diagnose_pdv_checkout_sql_attribution_pg.py
      - name: Generate temporary isolated session and test credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as out:
              for key in ("FM_AI_SESSION_SECRET", "FM_AI_FMCC_CONTROL_PLANE_TOKEN", "KCA15_INTERNAL_PASSWORD"):
                  value = secrets.token_urlsafe(48)
                  print(f"::add-mask::{value}")
                  out.write(f"{key}={value}\n")
          PY
      - name: Profile complete checkout and idempotent replay on PostgreSQL 16
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kordena_pdv_profile
        run: |
          python scripts/diagnose_pdv_checkout_sql_attribution_pg.py
      - name: Inspect attributed results
        if: always()
        run: |
          if test -f evidence/kordena-pdv-sql-70-attribution-pg16.json; then
            python -m json.tool evidence/kordena-pdv-sql-70-attribution-pg16.json > /dev/null
          fi
      - name: Upload detailed trace evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kordena-pdv-sql-attribution-pg16
          path: evidence/kordena-pdv-sql-70-attribution-pg16.json
          if-no-files-found: warn
          retention-days: 14
