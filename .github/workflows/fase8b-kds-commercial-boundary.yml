name: Fase 8B KDS Commercial Boundary Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'application/kds_*.py'
      - 'core/kds/**'
      - 'core/seguranca/**'
      - 'migrations/runner.py'
      - 'tests/unit/kds/**'
      - 'tests/integration/kds/**'
      - 'tests/fitness/test_f8_kds_commercial_boundary.py'
      - 'docs/inventario-fase8-kds-commercial-v1.md'
      - '.github/workflows/fase8b-kds-commercial-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f8b:
    name: Identity + RBAC + commercial boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2

      - name: Compile F8-B
        run: |
          python -m compileall -q \
            app.py \
            application/kds_runtime.py \
            application/kds_runtime_core.py \
            application/kds_roteamento.py \
            application/kds_transacoes.py \
            core/kds \
            tests/fitness/test_f8_kds_commercial_boundary.py

      - name: Ruff F8-B
        run: |
          ruff check \
            application/kds_runtime.py \
            application/kds_runtime_core.py \
            application/kds_roteamento.py \
            application/kds_transacoes.py \
            core/kds \
            tests/unit/kds \
            tests/integration/kds \
            tests/fitness/test_f8_kds_commercial_boundary.py

      - name: Mypy F8-B
        run: |
          mypy \
            application/kds_runtime.py \
            application/kds_runtime_core.py \
            application/kds_roteamento.py \
            application/kds_transacoes.py \
            core/kds \
            tests/unit/kds \
            tests/integration/kds

      - name: Fitness commercial boundary
        run: pytest -q tests/fitness/test_f8_kds_commercial_boundary.py

      - name: Regressões KDS e RBAC
        run: |
          pytest -q \
            tests/unit/kds \
            tests/integration/kds
