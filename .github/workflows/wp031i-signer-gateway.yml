name: WP-031I Signer Gateway

on:
  pull_request:
    paths:
      - 'core/integracoes/**'
      - 'core/seguranca/**'
      - 'infra/fiscal/**'
      - 'infra/integracoes/**'
      - 'infra/seguranca/**'
      - 'tests/integration/fiscal/test_wp031i_signer_gateway.py'
      - 'docs/web-parity/**'
      - '.github/workflows/wp031i-signer-gateway.yml'
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'core/integracoes/**'
      - 'core/seguranca/**'
      - 'infra/fiscal/**'
      - 'infra/integracoes/**'
      - 'infra/seguranca/**'
      - 'tests/integration/fiscal/test_wp031i_signer_gateway.py'
      - 'docs/web-parity/**'
      - '.github/workflows/wp031i-signer-gateway.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signer-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Verify frozen Fiscal V1 baseline
        run: python scripts/validate_wp031_vendor_baseline.py
      - name: Compile signer gateway
        run: |
          python -m py_compile \
            infra/fiscal/runtime_adapters.py \
            infra/fiscal/__init__.py \
            core/integracoes/catalogo.py \
            tests/integration/fiscal/test_wp031i_signer_gateway.py
      - name: Ruff
        run: |
          ruff check \
            infra/fiscal/runtime_adapters.py \
            infra/fiscal/__init__.py \
            core/integracoes/catalogo.py \
            tests/integration/fiscal/test_wp031i_signer_gateway.py
      - name: Mypy
        run: |
          mypy \
            infra/fiscal/runtime_adapters.py \
            --follow-imports=skip
      - name: Migration manifest
        run: |
          python - <<'PY'
          from migrations.manifest import assert_migration_manifest
          from migrations.runner import DEFAULT_MIGRATIONS
          assert_migration_manifest(DEFAULT_MIGRATIONS)
          print("Migration manifest: PASS")
          PY
      - name: Schema baseline
        run: python scripts/generate_schema_baseline_v1.py --check
      - name: WP-031I targeted tests
        run: pytest -q tests/integration/fiscal/test_wp031i_signer_gateway.py
      - name: Fiscal regression
        run: pytest -q tests/integration/fiscal
      - name: Full Python regression
        run: pytest -q
      - name: Diff whitespace gate
        run: git diff --check 4b0a929a190251eda63db99350d80435e32b7e13..HEAD
