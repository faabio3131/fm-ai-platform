name: Fase 6B Economic Edge Cleanup Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/checkout.py'
      - 'core/pdv/servicos.py'
      - 'core/pdv/cutover_canonico.py'
      - 'core/pdv/executor_canonico.py'
      - 'core/pdv/adaptadores_sqlalchemy.py'
      - 'tests/integration/pdv/test_zero_total.py'
      - 'tests/fitness/test_f6b_zero_total_canonical.py'
      - 'docs/system-design-fase6b-economic-edge-cleanup-v1.md'
      - 'docs/inventario-fase6-pdv-pedido-pagamento-estoque-v1.md'
      - '.github/workflows/fase6b-economic-edge-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f6b:
    name: Zero total sem obrigação fictícia
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compilar F6-B
        run: >-
          python -m compileall -q
          application/checkout.py
          core/pdv
          tests/integration/pdv/test_zero_total.py
          tests/fitness/test_f6b_zero_total_canonical.py
      - name: Ruff F6-B
        run: >-
          ruff check
          application/checkout.py
          core/pdv/servicos.py
          core/pdv/cutover_canonico.py
          core/pdv/executor_canonico.py
          core/pdv/adaptadores_sqlalchemy.py
          tests/integration/pdv/test_zero_total.py
          tests/fitness/test_f6b_zero_total_canonical.py
      - name: Mypy F6-B
        run: mypy application/checkout.py core/pdv
      - name: Saldo zero canônico
        run: >-
          pytest -q
          tests/integration/pdv/test_zero_total.py
          tests/fitness/test_f6b_zero_total_canonical.py
      - name: Regressões PDV críticas
        run: >-
          pytest -q
          tests/integration/pdv/test_canary_integrado.py
          tests/integration/pdv/test_rollback.py
          tests/integration/pdv/test_pix_producao.py
