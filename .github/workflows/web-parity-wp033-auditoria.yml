name: Web Parity WP033 Auditoria

on:
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'application/auditoria_web.py'
      - 'http_api/admin_auditoria.py'
      - 'http_api/frontend_app.py'
      - 'infra/seguranca/auditoria_sqlalchemy.py'
      - 'web/src/app/admin/auditoria/**'
      - 'web/src/features/backoffice/auditoria/**'
      - 'web/src/features/shell/module-registry.ts'
      - 'tests/api/test_admin_auditoria_http_contract.py'
      - 'web/tests/wp033-auditoria-navigation.test.mjs'
      - '.github/workflows/web-parity-wp033-auditoria.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp033:
    name: WP033 audit Web gate
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Compile WP033
        run: python -m compileall -q application/auditoria_web.py http_api/admin_auditoria.py
      - name: Ruff WP033
        run: ruff check application/auditoria_web.py http_api/admin_auditoria.py tests/api/test_admin_auditoria_http_contract.py
      - name: Mypy WP033
        run: mypy application/auditoria_web.py http_api/admin_auditoria.py
      - name: WP033 targeted matrix
        run: pytest -q tests/api/test_admin_auditoria_http_contract.py
      - name: Full Python regression
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: ESLint WP033
        working-directory: web
        run: npx eslint src/app/admin/auditoria/page.tsx src/features/backoffice/auditoria src/features/shell/module-registry.ts
      - name: TypeScript
        working-directory: web
        run: npx tsc --noEmit
      - name: Navigation test
        working-directory: web
        run: node --test tests/wp033-auditoria-navigation.test.mjs
      - name: Next production build
        working-directory: web
        run: npm run build
      - name: Diff whitespace gate
        run: git diff --check origin/${{ github.event.repository.default_branch }}...HEAD
