name: PR19 Hotfix Temporario

on:
  push:
    branches: [codex/implementar-crm-conversao-consentida-v1]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/implementar-crm-conversao-consentida-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Corrigir semantica de idempotencia no funil restrito
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('core/crm/servicos.py')
          s = p.read_text()
          antigo = '''        salvo, criado = self.marketplace_clientes.registrar(cliente)\n        if criado:\n'''
          novo = '''        salvo, idempotente = self.marketplace_clientes.registrar(cliente)\n        if not idempotente:\n'''
          if antigo not in s:
              raise SystemExit('trecho esperado não encontrado')
          p.write_text(s.replace(antigo, novo, 1))
          PY
      - name: Validar foco
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff==0.16.1 mypy==1.20.2
          ruff check core/crm tests/unit/crm tests/integration/crm
          mypy core/crm
          pytest -q tests/unit/crm tests/integration/crm
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/crm/servicos.py
          git diff --cached --quiet || git commit -m 'fix(crm): registrar entrada inicial do funil marketplace'
          git push origin HEAD:codex/implementar-crm-conversao-consentida-v1
