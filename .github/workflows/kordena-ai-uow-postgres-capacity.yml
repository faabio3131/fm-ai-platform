name: Kordena AI UoW isolated PostgreSQL capacity
on:
  pull_request:
    branches:
      - staging/kordena-premium
    paths:
      - application/gerente_ia_web.py
      - application/ai_router_runtime.py
      - scripts/kordena_ai_uow_capacity_probe.py
      - .github/workflows/kordena-ai-uow-postgres-capacity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-ai-uow-load:
    name: Core AI simulated load / PostgreSQL 16
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kordena_core_ai_bench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kordena_core_ai_bench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Generate one-time isolated credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as out:
              for name in ("FM_AI_SESSION_SECRET", "FM_AI_FMCC_CONTROL_PLANE_TOKEN", "KCA15_INTERNAL_PASSWORD"):
                  value = secrets.token_urlsafe(48)
                  print(f"::add-mask::{value}")
                  out.write(f"{name}={value}\n")
          PY
      - name: Prove DB connection release and role revocation
        env:
          PYTHONPATH: .
        run: |
          pytest -q tests/integration/gerente_ia/test_gerente_ai_pool_release.py
      - name: Run bounded simulated-IA load against real PostgreSQL
        env:
          FM_AI_ENV: staging
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kordena_core_ai_bench
          FM_AI_TENANT_ID: core-load-bootstrap
          FM_AI_UNIDADE_ID: core-load-bootstrap
          FM_AI_COMMERCIAL_ACCESS_GATE_ENABLED: "1"
          PYTHONPATH: .
        run: |
          python scripts/kordena_ai_uow_capacity_probe.py
      - name: Publish measured JSON results
        if: always()
        run: |
          if test -f evidence/kordena-ai-simulated-load-20261016.json; then
            python -m json.tool evidence/kordena-ai-simulated-load-20261016.json
          fi
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kordena-ai-uow-postgres-20261016
          path: evidence/kordena-ai-simulated-load-20261016.json
          if-no-files-found: warn
          retention-days: 14
