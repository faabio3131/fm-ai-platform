name: Kordena Session Cleanup Restricted PostgreSQL Gate

on:
  pull_request:
    branches:
      - staging/kordena-premium
    paths:
      - scripts/cleanup_expired_operational_sessions.py
      - scripts/provision_session_cleanup_role.py
      - tests/integration/test_session_cleanup_restricted_pg.py
      - .github/workflows/kordena-session-cleanup-restricted-pg.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restricted-role-pg16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kordena_session_cleanup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kordena_session_cleanup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest ruff
      - name: Static quality
        run: |
          ruff check scripts/cleanup_expired_operational_sessions.py scripts/provision_session_cleanup_role.py tests/integration/test_session_cleanup_restricted_pg.py
      - name: Test role isolation and bounded deletion in PostgreSQL 16
        env:
          PYTHONPATH: .
          FM_AI_RESTRICTED_PG_TEST: "1"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/kordena_session_cleanup_test
        run: |
          pytest -q tests/integration/test_session_cleanup_restricted_pg.py tests/api/test_pdv_auth_hotpath_sql.py
