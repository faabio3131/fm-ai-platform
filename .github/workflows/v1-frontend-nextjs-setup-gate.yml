name: V1 Frontend Next.js Setup Gate

on:
  push:
    branches:
      - "feat/v1-frontend-nextjs-setup"
    paths:
      - "web/**"
      - "http_api/frontend_app.py"
      - "tests/fitness/f15_frontend_cors_v1.py"
      - ".github/workflows/v1-frontend-nextjs-setup-gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - "http_api/frontend_app.py"
      - "tests/fitness/f15_frontend_cors_v1.py"
      - ".github/workflows/v1-frontend-nextjs-setup-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-regression-and-cors:
    name: Backend 1291 baseline + CORS + Ruff + mypy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Preserve inherited Python regression
        run: pytest -q
      - name: Certify local frontend CORS contract
        run: pytest -q tests/fitness/f15_frontend_cors_v1.py
      - name: Ruff repository
        run: ruff check .
      - name: Mypy changed HTTP boundary
        run: mypy http_api/frontend_app.py tests/fitness/f15_frontend_cors_v1.py

  frontend-quality:
    name: Next.js + shadcn lint and production build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate shadcn workspace
        run: npx shadcn@latest info
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
