name: Fase 9B Impressao Commercial Boundary Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'application/impressao_transacoes.py'
      - 'core/impressao/**'
      - 'infra/seguranca/auditoria_sqlalchemy.py'
      - 'infra/transacoes/uow.py'
      - 'migrations/runner.py'
      - 'tests/unit/impressao/**'
      - 'tests/integration/impressao/**'
      - 'tests/fitness/test_f9_impressao_commercial_boundary.py'
      - 'scripts/check_commercial_runtime_readiness_v1.py'
      - 'docs/commercial_runtime_readiness_v1.json'
      - '.github/workflows/fase9b-impressao-commercial-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f9b:
    name: Application UoW + anti-Fake + schema oficial
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: f9
          POSTGRES_PASSWORD: f9
          POSTGRES_DB: f9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f9 -d f9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2

      - name: Compile F9-B
        run: |
          python -m compileall -q             application/impressao_transacoes.py             core/impressao             tests/integration/impressao             tests/fitness/test_f9_impressao_commercial_boundary.py

      - name: Ruff F9-B
        run: |
          ruff check             application/impressao_transacoes.py             core/impressao             tests/integration/impressao             tests/fitness/test_f9_impressao_commercial_boundary.py             scripts/check_commercial_runtime_readiness_v1.py

      - name: Mypy F9-B
        run: mypy application/impressao_transacoes.py core/impressao

      - name: Fitness commercial boundary
        run: |
          pytest -q             tests/fitness/test_f9_impressao_commercial_boundary.py             tests/fitness/test_commercial_runtime_readiness_v1.py

      - name: Regressao Impressao
        run: pytest -q tests/unit/impressao tests/integration/impressao

      - name: Provar migration oficial 0012 em PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://f9:f9@localhost:5432/f9
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect
          from migrations.runner import run_migrations, assert_schema_current

          engine = create_engine(os.environ["DATABASE_URL"], future=True)
          run_migrations(engine)
          assert_schema_current(engine)
          tables = set(inspect(engine).get_table_names())
          assert "impressao_jobs_v1" in tables
          print("F9-B PostgreSQL schema current; impressao_jobs_v1 via migration 0012")
          PY
