name: V1 Wave2 KDS

on:
  push:
    branches: [impl/v1-wave2-restaurant-operations]
  pull_request:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - 'application/kds_*.py'
      - 'core/kds/**'
      - 'core/pedidos/**'
      - 'core/estados/**'
      - 'infra/eventos/**'
      - 'infra/seguranca/**'
      - 'migrations/**'
      - 'tests/integration/wave2/**'
      - 'tests/integration/kds/**'
      - 'tests/e2e-kds/**'
      - 'playwright.kds.config.ts'
      - '.github/workflows/v1-wave2-kds.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kds:
    name: KDS-001 autoritativo e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1
          npm ci
          npx playwright install chromium
      - name: Compilar KDS
        run: >-
          python -m compileall -q application/kds_runtime.py application/kds_roteamento.py
          core/kds core/pedidos core/estados infra/eventos infra/seguranca migrations
          tests/integration/wave2
      - name: Ruff KDS
        run: >-
          ruff check application/kds_runtime.py application/kds_roteamento.py
          core/kds core/pedidos core/estados infra/eventos infra/seguranca
          migrations/runner.py tests/integration/wave2
      - name: Provas autoritativas KDS-001
        run: pytest -q tests/integration/wave2/test_kds_authoritative_runtime.py tests/integration/kds
      - name: Regressao Python completa
        run: pytest -q
      - name: Jornada real de navegador KDS
        run: npx playwright test -c playwright.kds.config.ts --reporter=list
