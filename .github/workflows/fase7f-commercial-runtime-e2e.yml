name: Fase 7F Commercial Runtime E2E Gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.py'
      - 'pages/8_Atendimento_Garcom.py'
      - 'application/salao_transacoes.py'
      - 'application/garcom_transacoes.py'
      - 'core/salao/**'
      - 'core/garcom/**'
      - 'core/kds/**'
      - 'core/pagamentos/**'
      - 'core/runtime/**'
      - 'core/seguranca/**'
      - 'infra/seguranca/**'
      - 'infra/streamlit_app/auth_ui.py'
      - 'migrations/**'
      - 'scripts/seed_f7f_commercial_runtime.py'
      - 'tests/e2e/f7f-commercial-*.spec.ts'
      - 'playwright.f7f.config.ts'
      - 'docs/inventario-fase7-salao-garcom-v1.md'
      - '.github/workflows/fase7f-commercial-runtime-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f7f-commercial:
    name: PostgreSQL + login + Salao desktop + Garcom mobile/tablet
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fm_ai_f7f
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fm_ai_f7f"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      FM_AI_ENV: staging
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/fm_ai_f7f
      FM_AI_TENANT_ID: tenant-f7f
      FM_AI_UNIDADE_ID: unidade-f7f
      FM_AI_SALAO_V1: '1'
      FM_AI_GARCOM_V1: '1'
      FM_AI_ADAPTER_ORDERS: sqlalchemy
      FM_AI_ADAPTER_PAYMENTS: sqlalchemy
      FM_AI_ADAPTER_SALAO: sqlalchemy
      FM_AI_ADAPTER_GARCOM: sqlalchemy
      FM_AI_ADAPTER_KDS: sqlalchemy
      FM_AI_ADAPTER_AUTH: sqlalchemy
      FM_AI_SECRET_MASTER_KEY: bW1scnZpQzlCS2Q1dXBlTXRyUkJlTGNXWGtIclc3WktoM3lrb3Q5WT0=
      PYTHONUNBUFFERED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
          npm ci

      - name: Provar runtime comercial e adapters reais
        run: |
          test -z "${FM_AI_TEST_MODE:-}"
          python - <<'PY'
          from core.garcom.flags import garcom_v1_enabled
          from core.runtime.config import RuntimeEnvironment, load_runtime_settings
          from core.salao.flags import salao_v1_enabled

          settings = load_runtime_settings()
          assert settings.environment is RuntimeEnvironment.STAGING
          assert settings.commercial
          assert salao_v1_enabled()
          assert garcom_v1_enabled()
          print("F7-F commercial composition ready")
          PY

      - name: Compile Ruff Mypy F7-F
        run: |
          python -m compileall -q \
            scripts/seed_f7f_commercial_runtime.py \
            application/salao_transacoes.py \
            application/garcom_transacoes.py \
            core/salao \
            core/garcom \
            pages/8_Atendimento_Garcom.py
          ruff check \
            scripts/seed_f7f_commercial_runtime.py \
            application/salao_transacoes.py \
            application/garcom_transacoes.py \
            core/salao \
            core/garcom \
            pages/8_Atendimento_Garcom.py
          mypy application/salao_transacoes.py application/garcom_transacoes.py core/salao core/garcom

      - name: Preparar PostgreSQL comercial F7-F
        run: |
          test -z "${FM_AI_TEST_MODE:-}"
          python -m scripts.seed_f7f_commercial_runtime
          python -m scripts.migrate_v1
          python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from migrations.runner import assert_schema_current

          engine = create_engine(os.environ['DATABASE_URL'], future=True)
          assert_schema_current(engine)
          print('F7-F schema current')
          PY

      - name: Regressao boundaries F7
        run: |
          pytest -q \
            tests/fitness/test_f7_commercial_salao_garcom_boundary.py \
            tests/integration/fase7/test_production_kds_garcom_chain.py \
            tests/integration/salao/test_commercial_payment_composition.py \
            tests/integration/garcom/test_garcom_transaction_ownership.py

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser comercial F7-F
        run: |
          test -z "${FM_AI_TEST_MODE:-}"
          npx playwright test -c playwright.f7f.config.ts --reporter=list

      - name: Evidencia PostgreSQL pos-browser
        if: always()
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ['DATABASE_URL'], future=True)
          with engine.connect() as connection:
              gerente = connection.execute(
                  text("select status, saldo from comandas_v1 where id='comanda-f7f-gerente' and tenant_id='tenant-f7f' and unidade_id='unidade-f7f'")
              ).one()
              pagamento = connection.execute(
                  text("select status, valor_pago, saldo from pagamentos_v1 where comanda_id='comanda-f7f-gerente' and tenant_id='tenant-f7f' and unidade_id='unidade-f7f'")
              ).one()
              producao = connection.execute(
                  text("select status from producao_itens_v1 where id='producao-f7f' and tenant_id='tenant-f7f' and unidade_id='unidade-f7f'")
              ).one()
              assert gerente.status == 'fechada'
              assert str(gerente.saldo) in {'0.00', '0.0000'}
              assert pagamento.status == 'pago'
              assert str(pagamento.saldo) in {'0.00', '0.0000'}
              assert producao.status == 'pronta'
              print({'comanda': gerente.status, 'pagamento': pagamento.status, 'kds': producao.status})
          PY

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: f7f-playwright-report
          path: playwright-report-f7f/
          if-no-files-found: ignore
