name: V1 Wave1 Residual Ruff Fix

on:
  push:
    branches: [impl/v1-wave1-authoritative-transactions]
    paths:
      - '.github/workflows/v1-wave1-residual-ruff-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: impl/v1-wave1-authoritative-transactions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar três correções residuais verificadas
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: esperado 1 trecho, encontrado {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_exact(
              "core/dominio/eventos.py",
              'raise ValueError("correlation_id é obrigatório")',
              'raise TypeError("correlation_id é obrigatório")',
          )
          replace_exact(
              "core/dominio/eventos.py",
              'raise TypeError("tipo de evento operacional de pedido invalido")',
              'raise ValueError("tipo de evento operacional de pedido invalido")',
          )
          replace_exact(
              "core/estoque/adaptador_sqlalchemy.py",
              'raise ValueError("snapshot de estoque persistido invalido")',
              'raise TypeError("snapshot de estoque persistido invalido")',
          )
          replace_exact(
              "core/estados/maquinas.py",
              '''    if (\n        snapshot.aggregate_type == "pedido"\n        and snapshot.estado == "confirmado"\n        and comando.destino == "enviado_producao"\n    ):\n        if comando.decisao_cozinha is None or not comando.decisao_cozinha.permitido:\n            raise ErroTransicao("cozinha_nao_autorizada")''',
              '''    if (\n        snapshot.aggregate_type == "pedido"\n        and snapshot.estado == "confirmado"\n        and comando.destino == "enviado_producao"\n        and (comando.decisao_cozinha is None or not comando.decisao_cozinha.permitido)\n    ):\n        raise ErroTransicao("cozinha_nao_autorizada")''',
          )
          PY
      - name: Confirmar Ruff limpo
        run: |
          python -m pip install ruff==0.16.1
          ruff check core/pedidos core/pagamentos core/estoque core/eventos core/dominio core/estados infra/eventos infra/transacoes infra/seguranca migrations/runner.py tests/integration/wave1 tests/unit/events tests/unit/runtime/test_runtime_foundation.py
      - name: Commitar correções
        run: |
          git diff --check
          git config user.name "fm-ai-wave1-bot"
          git config user.email "fm-ai-wave1-bot@users.noreply.github.com"
          git add core/dominio/eventos.py core/estoque/adaptador_sqlalchemy.py core/estados/maquinas.py
          git commit -m "V1 Wave1: fix residual Ruff findings"
          git fetch origin impl/v1-wave1-authoritative-transactions
          git rebase origin/impl/v1-wave1-authoritative-transactions
          git push origin HEAD:impl/v1-wave1-authoritative-transactions
