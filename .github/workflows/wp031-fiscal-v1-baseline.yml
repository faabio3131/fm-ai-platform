name: WP-031 Fiscal V1 Baseline

on:
  pull_request:
    paths:
      - 'kordena_fiscal/**'
      - 'docs/web-parity/WP031_FISCAL_V1_VENDOR_BASELINE.json'
      - 'scripts/validate_wp031_vendor_baseline.py'
      - 'requirements.txt'
      - '.github/workflows/wp031-fiscal-v1-baseline.yml'
  push:
    branches:
      - feat/web-parity-v1-total-original-migration
    paths:
      - 'kordena_fiscal/**'
      - 'docs/web-parity/WP031_FISCAL_V1_VENDOR_BASELINE.json'
      - 'scripts/validate_wp031_vendor_baseline.py'
      - 'requirements.txt'
      - '.github/workflows/wp031-fiscal-v1-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fiscal-v1-baseline:
    name: Verify frozen Fiscal V1 baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Fiscal V1 runtime dependency
        run: python -m pip install 'lxml>=5.3,<7'
      - name: Verify vendored baseline provenance
        run: python scripts/validate_wp031_vendor_baseline.py
      - name: Compile Fiscal V1 package
        run: python -m compileall -q kordena_fiscal
      - name: Import Fiscal V1 public boundaries
        run: |
          python - <<'PY'
          from kordena_fiscal.archive import FiscalArchiveStore
          from kordena_fiscal.contingency import FiscalOutboxStore
          from kordena_fiscal.gateway import FiscalGatewayClient
          from kordena_fiscal.issuance import NfceIssuanceOrchestrator
          from kordena_fiscal.lifecycle import IdempotencyStore
          from kordena_fiscal.numbering import FiscalSequenceStore
          from kordena_fiscal.security import FiscalSigner
          from kordena_fiscal.tax import TaxRuleEngine
          from kordena_fiscal.xml import NfceXmlPayload
          print("Fiscal V1 public boundaries: PASS")
          PY
      - name: Diff whitespace gate
        run: git diff --check HEAD~1..HEAD
