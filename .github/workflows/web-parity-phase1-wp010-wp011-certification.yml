name: Web Parity Phase 1 WP010-WP011 Certification

on:
  pull_request:
    branches:
      - feat/web-parity-v1-wp010-wp011-delivery-entrega
    paths:
      - '.github/workflows/web-parity-phase1-wp010-wp011-certification.yml'
      - 'application/delivery_*.py'
      - 'application/entrega_*.py'
      - 'application/checkout.py'
      - 'application/catalogo_estoque_cutover.py'
      - 'core/delivery/**'
      - 'core/entrega/**'
      - 'core/pedidos/**'
      - 'core/pagamentos/**'
      - 'core/estoque/**'
      - 'core/kds/**'
      - 'http_api/delivery.py'
      - 'http_api/entrega.py'
      - 'http_api/kds.py'
      - 'infra/delivery/**'
      - 'infra/entrega/**'
      - 'infra/crm/**'
      - 'tests/api/test_delivery_entrega_http_contract.py'
      - 'tests/api/test_order_confirmation_kds_routing_http_contract.py'
      - 'tests/api/test_kds_http_contract.py'
      - 'tests/e2e-delivery/**'
      - 'tests/e2e-entrega/**'
      - 'tests/integration/delivery/**'
      - 'tests/integration/entrega/**'
      - 'playwright.delivery.config.ts'
      - 'playwright.entrega.config.ts'
      - 'docs/web-parity/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp010-wp011-certification:
    name: Delivery + Entrega integrated certification
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
          npm ci

      - name: Compile canonical WP010-WP011 surface
        run: |
          python -m compileall -q \
            application/delivery_contexto_comercial.py \
            application/delivery_checkout_comercial.py \
            application/delivery_operacao_comercial.py \
            application/entrega_composicao.py \
            application/entrega_kds_handoff.py \
            application/entrega_transacoes.py \
            core/delivery \
            core/entrega \
            http_api/delivery.py \
            http_api/entrega.py

      - name: Ruff WP010-WP011
        run: |
          ruff check \
            application/delivery_contexto_comercial.py \
            application/delivery_checkout_comercial.py \
            application/delivery_operacao_comercial.py \
            application/entrega_composicao.py \
            application/entrega_kds_handoff.py \
            application/entrega_transacoes.py \
            core/delivery \
            core/entrega \
            http_api/delivery.py \
            http_api/entrega.py \
            tests/api/test_delivery_entrega_http_contract.py \
            tests/api/test_order_confirmation_kds_routing_http_contract.py

      - name: Mypy WP010-WP011
        run: |
          mypy \
            application/delivery_contexto_comercial.py \
            application/delivery_checkout_comercial.py \
            application/delivery_operacao_comercial.py \
            application/entrega_composicao.py \
            application/entrega_kds_handoff.py \
            application/entrega_transacoes.py \
            core/delivery \
            core/entrega \
            http_api/delivery.py \
            http_api/entrega.py

      - name: HTTP and integration matrix WP010-WP011
        run: |
          pytest -q \
            tests/api/test_delivery_entrega_http_contract.py \
            tests/api/test_order_confirmation_kds_routing_http_contract.py \
            tests/api/test_kds_http_contract.py \
            tests/api/test_central_pedidos_http_contract.py \
            tests/integration/delivery \
            tests/integration/entrega

      - name: Full Python regression
        run: pytest -q

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Delivery browser journey
        run: npx playwright test -c playwright.delivery.config.ts --reporter=list

      - name: Entrega browser journey
        run: npx playwright test -c playwright.entrega.config.ts --reporter=list

      - name: Diff whitespace gate
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
