name: V1 Wave0 Production Foundation

on:
  push:
    branches: [main, impl/v1-wave0-production-foundation, integration/v1-functional-baseline]
  pull_request:
    branches: [main]
    paths:
      - 'core/runtime/**'
      - 'core/seguranca/**'
      - 'core/*/flags.py'
      - 'infra/**'
      - 'application/integracoes_admin_transacoes.py'
      - 'tests/fitness/test_af03_transaction_ownership.py'
      - 'tests/fitness/transaction_ownership_baseline_v1.json'
      - 'migrations/**'
      - 'scripts/**'
      - 'tests/unit/runtime/**'
      - 'tests/unit/security/**'
      - 'requirements.txt'
      - '.github/workflows/v1-wave0-production-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wave0:
    name: Runtime, DB e Segurança V1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff==0.16.1 mypy==1.20.2
      - name: Gate append-only do histórico de migrations
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/check_migration_history_v1.py --base-ref "$BASE_REF"
      - name: Compilar fundação
        run: >-
          python -m compileall -q application/integracoes_admin_transacoes.py
          core/integracoes core/runtime core/seguranca infra migrations scripts
          tests/fitness/test_af03_transaction_ownership.py
          tests/integration/integracoes/test_integracoes_admin_transaction_ownership.py
      - name: Ruff Wave0
        run: >-
          ruff check application/integracoes_admin_transacoes.py
          core/integracoes core/runtime core/seguranca infra
          migrations/runner.py migrations/history_guard.py
          migrations/migration_history_integrity_v1.py scripts
          tests/fitness/test_af03_transaction_ownership.py
          tests/fitness/test_af04_schema_convergence.py
          tests/fitness/test_af05_migration_manifest.py
          tests/integration/integracoes
          tests/integration/runtime/test_migration_postgres_convergence.py
          tests/unit/integracoes
          tests/unit/runtime/test_runtime_foundation.py
          tests/unit/security/test_authentication_v1.py
      - name: Mypy Wave0
        run: >-
          mypy application/integracoes_admin_transacoes.py
          core/integracoes core/runtime core/seguranca infra/integracoes
          infra/seguranca infra/streamlit_app migrations/runner.py
          migrations/history_guard.py migrations/migration_history_integrity_v1.py
      - name: Testes focados Wave0
        run: >-
          pytest -q tests/integration/integracoes tests/unit/integracoes
          tests/unit/runtime tests/unit/security
          tests/fitness/test_af03_transaction_ownership.py
      - name: Suite Python completa
        run: pytest -q


  migration-postgres:
    name: SD-1D PostgreSQL descartável
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gerente_ai_sd1d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gerente_ai_sd1d"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FM_AI_SD1D_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/gerente_ai_sd1d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Provar fresh/upgrade PostgreSQL SD-1D
        run: pytest -q tests/integration/runtime/test_migration_postgres_convergence.py
